name: cedr
description: Check Guard inventory and Sync agent configuration, report drift, repair generated files with a pull request, and run Bench suites
author: Sheernox
branding:
  icon: shield
  color: green

# docs/design.md, GitHub Action. Installs a released cedr binary after checking it against the
# release's SHA256SUMS, then runs `cedr guard lint` and `cedr guard verify` with GitHub annotations. It never
# runs a configured package or MCP server.
# The steps call Guard's old top-level names so that a `version` pinned before 0.6.0 keeps working.
inputs:
  version:
    description: cedr release to install (for example vX.Y.Z); default the action's own tag, else the latest release
    default: ""
  path:
    description: Repo root to check
    default: "."
  strict:
    description: Fail lint on warnings too
    default: "false"
  verify:
    description: "auto runs cedr guard verify when a lock exists; true requires one; false skips it"
    default: auto
  outdated:
    description: Report newer npm server versions as annotations without failing the job
    default: "true"
  sync:
    description: "auto checks Sync when .cedr/sync.toml exists; true requires it; false skips"
    default: auto
  sync-fix:
    description: "Repair Sync drift with a PR on push, schedule or workflow_dispatch; needs contents and pull-requests write"
    default: "false"
  bench:
    description: "A Bench suite to run, for example .cedr/bench/agents.toml; empty skips Bench. A suite is code: never point this at one from an untrusted pull request"
    default: ""
  bench-budget-usd:
    description: Cap for the Bench run in USD at API prices; default the app's cap when push-org and CEDR_API_KEY are set, else the CLI default
    default: ""
  bench-fail-on:
    description: "Fail when the candidate's pass rate is lower (lower), also with no overlap in the intervals (separated), or never"
    default: never
  push-org:
    description: When set with the CEDR_API_KEY env, send the results to this cedr.dev organization (also when the checks fail)
    default: ""

runs:
  using: composite
  steps:
    - name: Install cedr
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        version=$INPUT_VERSION
        if [ -z "$version" ] && [[ $ACTION_REF =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then version=$ACTION_REF; fi
        # A release tag only: anything else could point the download at another repository's release.
        if [ -n "$version" ] && ! [[ $version =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
          echo "::error title=cedr::version must be a release tag such as vX.Y.Z"
          exit 1
        fi
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64) asset=linux-x86_64 ext=tar.gz ;;
          Linux/ARM64) asset=linux-arm64 ext=tar.gz ;;
          macOS/X64) asset=macos-x86_64 ext=tar.gz ;;
          macOS/ARM64) asset=macos-arm64 ext=tar.gz ;;
          Windows/X64) asset=windows-x86_64 ext=zip ;;
          *) echo "::error title=cedr::no cedr build for $RUNNER_OS/$RUNNER_ARCH"; exit 1 ;;
        esac
        if [ -n "$version" ]; then
          base="https://github.com/Sheernox/cedr/releases/download/$version"
        else
          base="https://github.com/Sheernox/cedr/releases/latest/download"
        fi
        dir="$RUNNER_TEMP/cedr"
        mkdir -p "$dir"
        cd "$dir"
        archive="cedr-$asset.$ext"
        curl -fsSL --proto '=https' --tlsv1.2 --retry 3 -o "$archive" "$base/$archive"
        curl -fsSL --proto '=https' --tlsv1.2 --retry 3 -o SHA256SUMS "$base/SHA256SUMS"
        expected=$(awk -v f="$archive" '$2 == f || $2 == "*" f { print $1 }' SHA256SUMS)
        if command -v sha256sum >/dev/null; then
          actual=$(sha256sum "$archive" | awk '{ print $1 }')
        else
          actual=$(shasum -a 256 "$archive" | awk '{ print $1 }')
        fi
        if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
          echo "::error title=cedr::$archive does not match the release's SHA256SUMS"
          exit 1
        fi
        if [ "$ext" = zip ]; then unzip -q "$archive"; else tar -xzf "$archive"; fi
        echo "$dir/cedr-$asset" >> "$GITHUB_PATH"

    - name: cedr guard lint
      id: lint
      shell: bash
      continue-on-error: true
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_STRICT: ${{ inputs.strict }}
      run: |
        args=(lint "$INPUT_PATH" --format github)
        if [ "$INPUT_STRICT" = true ]; then args+=(--strict); fi
        cedr "${args[@]}"

    - name: cedr guard verify
      id: verify
      shell: bash
      continue-on-error: true
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_VERIFY: ${{ inputs.verify }}
      run: |
        case "$INPUT_VERIFY" in
          false) echo "verify skipped"; exit 0 ;;
          auto)
            if [ ! -f "$INPUT_PATH/.cedr/guard.lock" ] && [ ! -f "$INPUT_PATH/cedr.lock" ]; then
              echo "no lock: verify skipped (run cedr guard lock and commit .cedr/ to pin this setup)"
              exit 0
            fi ;;
          true) ;;
          *) echo "::error title=cedr::verify must be auto, true or false"; exit 1 ;;
        esac
        cedr verify "$INPUT_PATH" --format github

    - name: cedr guard outdated
      if: ${{ always() && inputs.outdated == 'true' }}
      shell: bash
      continue-on-error: true
      env:
        INPUT_PATH: ${{ inputs.path }}
      run: cedr outdated "$INPUT_PATH" --format github

    - name: cedr bench
      id: bench
      if: ${{ always() && inputs.bench != '' }}
      shell: bash
      continue-on-error: true
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_SUITE: ${{ inputs.bench }}
        INPUT_BUDGET: ${{ inputs.bench-budget-usd }}
        INPUT_FAIL_ON: ${{ inputs.bench-fail-on }}
        INPUT_ORG: ${{ inputs.push-org }}
      run: |
        set -uo pipefail
        cd "$INPUT_PATH" || exit 2
        args=(bench run "$INPUT_SUITE" --fail-on "$INPUT_FAIL_ON")
        if [ -n "$INPUT_BUDGET" ]; then
          args+=(--budget-usd "$INPUT_BUDGET")
        elif [ -n "$INPUT_ORG" ] && [ -n "${CEDR_API_KEY:-}" ]; then
          cedr bench budget --pull --org "$INPUT_ORG" || exit 2
        fi
        cedr "${args[@]}" | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"

    - name: cedr sync fix
      id: sync-fix
      shell: bash
      continue-on-error: true
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FIX: ${{ inputs.sync-fix }}
        EVENT: ${{ github.event_name }}
        GH_TOKEN: ${{ github.token }}
        BASE: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        case "$INPUT_FIX" in false) exit 0 ;; true) ;; *) echo "::error title=cedr::sync-fix must be true or false"; exit 1 ;; esac
        case "$EVENT" in push|schedule|workflow_dispatch) ;; *) echo "::error title=cedr::sync-fix requires push, schedule or workflow_dispatch"; exit 1 ;; esac
        cd "$INPUT_PATH"
        if [ -n "$(git status --porcelain)" ]; then echo "::error title=cedr::sync-fix requires a clean checkout"; exit 1; fi
        cedr sync
        if [ -z "$(git status --porcelain)" ]; then exit 0; fi
        git checkout -B cedr/sync-fix
        changed=()
        while IFS= read -r -d '' path; do changed+=("$path"); done < <(git ls-files --modified --others --exclude-standard -z)
        git add -- "${changed[@]}"
        git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(sync): regenerate agent configuration'
        if git ls-remote --exit-code --heads origin cedr/sync-fix >/dev/null 2>&1; then
          git fetch origin refs/heads/cedr/sync-fix:refs/remotes/origin/cedr/sync-fix
        fi
        git push --force-with-lease origin HEAD:refs/heads/cedr/sync-fix
        body="$RUNNER_TEMP/cedr-sync-pr.md"
        cat > "$body" <<'PR'
        > 🎯 **TLDR:** Refresh native agent configuration from the repository's .cedr sources.

        #### 🧩 Problem
        Generated agent files differ from their shared sources.

        #### 🛠️ Solution
        Run cedr sync to **regenerate the native files and lock**.

        | ✅ Verified | ⚠️ Risk | 🚀 Deploy impact |
        | --- | --- | --- |
        | cedr sync completed; organization checks run separately | Review changes to agent instructions and permissions | No deployment |
        PR
        number=$(gh pr list --head cedr/sync-fix --base "$BASE" --json number --jq '.[0].number // empty')
        if [ -n "$number" ]; then
          gh pr edit "$number" --title 'fix(sync): regenerate agent configuration' --body-file "$body"
        else
          gh pr create --head cedr/sync-fix --base "$BASE" --title 'fix(sync): regenerate agent configuration' --body-file "$body"
        fi

    - name: cedr sync check
      id: sync
      shell: bash
      continue-on-error: true
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_SYNC: ${{ inputs.sync }}
      run: |
        case "$INPUT_SYNC" in
          false) exit 0 ;;
          auto) if [ ! -f "$INPUT_PATH/.cedr/sync.toml" ]; then echo "no Sync configuration: skipped"; exit 0; fi ;;
          true) ;;
          *) echo "::error title=cedr::sync must be auto, true or false"; exit 1 ;;
        esac
        cedr sync check "$INPUT_PATH" --format github

    - name: cedr guard push
      if: ${{ always() && inputs.push-org != '' }}
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_ORG: ${{ inputs.push-org }}
      run: |
        if [ -z "${CEDR_API_KEY:-}" ]; then
          echo "::warning title=cedr::push-org is set but CEDR_API_KEY is not; nothing was sent"
          exit 0
        fi
        if [ -f "$INPUT_PATH/.cedr/sync.toml" ]; then
          cedr sync push "$INPUT_PATH" --org "$INPUT_ORG" --repo "$GITHUB_REPOSITORY" || exit $?
        fi
        if [ ! -f "$INPUT_PATH/.cedr/guard.lock" ] && [ ! -f "$INPUT_PATH/cedr.lock" ]; then
          echo "::warning title=cedr::no lock to push; run cedr guard lock and commit .cedr/"
          exit 0
        fi
        # --org without --config reads no routes.toml from the checkout, so it cannot redirect the key.
        cedr push "$INPUT_PATH" --org "$INPUT_ORG" --repo "$GITHUB_REPOSITORY" --updates

    - name: Result
      if: ${{ always() }}
      shell: bash
      env:
        LINT: ${{ steps.lint.outcome }}
        VERIFY: ${{ steps.verify.outcome }}
        SYNC: ${{ steps.sync.outcome }}
        SYNC_FIX: ${{ steps.sync-fix.outcome }}
        BENCH: ${{ steps.bench.outcome }}
      run: |
        echo "cedr guard lint: $LINT, cedr guard verify: $VERIFY"
        [ "$LINT" != failure ] && [ "$VERIFY" != failure ] && [ "$SYNC" != failure ] && [ "$SYNC_FIX" != failure ] && [ "$BENCH" != failure ]
