[workspace]
resolver = "3"
members = ["crates/cedr-sync", "crates/cedr-monitor", "crates/cedr-core", "crates/cedr-route", "crates/cedr"]

[workspace.package]
version = "0.5.1"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
cedr-sync = { path = "crates/cedr-sync" }
cedr-core = { path = "crates/cedr-core" }
cedr-route = { path = "crates/cedr-route" }
cedr-monitor = { path = "crates/cedr-monitor" }
