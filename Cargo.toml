[workspace]
resolver = "3"
members = ["crates/cedr-agent", "crates/cedr-bench", "crates/cedr-sync", "crates/cedr-monitor", "crates/cedr-core", "crates/cedr-route", "crates/cedr-compare", "crates/cedr"]

[workspace.package]
version = "0.14.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
cedr-sync = { path = "crates/cedr-sync" }
cedr-core = { path = "crates/cedr-core" }
cedr-route = { path = "crates/cedr-route" }
cedr-monitor = { path = "crates/cedr-monitor" }
cedr-compare = { path = "crates/cedr-compare" }
cedr-agent = { path = "crates/cedr-agent" }
cedr-bench = { path = "crates/cedr-bench" }
