[package]
name = "cedr"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "cedr"
path = "src/main.rs"

[dependencies]
cedr-sync.workspace = true
cedr-core.workspace = true
cedr-route.workspace = true
cedr-monitor.workspace = true
cedr-bench.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
flate2 = "1"
getrandom = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
rmcp = { version = "3.8", default-features = false, features = ["server", "macros", "transport-io"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
tokio = { version = "1", features = ["rt"] }
toml_edit = "0.25"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
toml = "1"
